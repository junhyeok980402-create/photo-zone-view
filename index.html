<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#120F18">
<title>GoodDevice photo zone</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237C3AED'/%3E%3Cstop offset='1' stop-color='%23EC4899'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Ccircle cx='16' cy='17' r='6' fill='none' stroke='white' stroke-width='2.5'/%3E%3Cpath d='M9 10h14' stroke='white' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  *, *::before, *::after { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: #120F18;
    color: #F2EEF8;
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont,
                 "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    line-height: 1.6;
    text-align: center;
    display: flex;
    flex-direction: column;
    background-image:
      radial-gradient(70% 45% at 12% 0%, rgba(124, 58, 237, .38), transparent 70%),
      radial-gradient(60% 40% at 92% 8%, rgba(236, 72, 153, .28), transparent 70%);
    background-repeat: no-repeat;
    background-attachment: fixed;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }

  .brand {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    padding: 16px 20px 10px;
    font-size: 16px; font-weight: 800; letter-spacing: -.015em;
    flex: none;
  }

  .brand .mark {
    width: 30px; height: 30px; border-radius: 10px;
    background: linear-gradient(135deg, #7C3AED, #EC4899);
    display: grid; place-items: center;
    box-shadow: 0 6px 18px -6px rgba(236, 72, 153, .8);
    flex: none;
  }

  .brand .mark svg { width: 17px; height: 17px; fill: #fff; }

  #app {
    flex: 1; min-height: 0;
    display: flex; flex-direction: column;
    padding: 0 14px calc(12px + env(safe-area-inset-bottom));
    gap: 12px;
  }

  /* --- 사진 --- */
  #stage {
    flex: 1; min-height: 0;
    display: flex; align-items: center; justify-content: center;
  }

  #view {
    display: block;
    border-radius: 16px;
    box-shadow: 0 18px 44px -18px rgba(0, 0, 0, .9);
    touch-action: none;
  }

  /* --- 아래 조작줄 --- */
  .tools { flex: none; display: flex; flex-direction: column; gap: 10px; }

  .hint {
    margin: 0; font-size: 12px;
    color: rgba(242, 238, 248, .45);
    min-height: 18px;
  }

  .chips {
    display: flex; gap: 8px;
    overflow-x: auto; padding: 2px 2px 4px;
    scrollbar-width: none;
  }

  .chips::-webkit-scrollbar { display: none; }

  .chip {
    flex: none; padding: 9px 15px;
    border-radius: 20px; border: 1px solid rgba(255,255,255,.12);
    background: rgba(255,255,255,.05);
    color: rgba(242,238,248,.72);
    font-size: 13.5px; font-weight: 700;
    font-family: inherit;
  }

  .chip[aria-pressed="true"] {
    background: linear-gradient(135deg, #7C3AED, #EC4899);
    border-color: transparent; color: #fff;
  }

  .row { display: flex; gap: 10px; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    flex: 1; padding: 15px 18px;
    border: 0; border-radius: 15px;
    background: linear-gradient(135deg, #7C3AED, #EC4899);
    color: #fff; text-decoration: none;
    font-size: 16px; font-weight: 800; letter-spacing: -.01em;
    font-family: inherit;
    box-shadow: 0 12px 28px -10px rgba(236, 72, 153, .75);
  }

  .btn.ghost {
    flex: none; background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.14);
    box-shadow: none;
  }

  .btn:active { transform: translateY(1px); filter: brightness(.95); }
  .btn[disabled] { opacity: .5; }

  .btn svg {
    width: 19px; height: 19px; flex: none;
    fill: none; stroke: currentColor; stroke-width: 2;
    stroke-linecap: round; stroke-linejoin: round;
  }

  /* --- 스티커 고르는 창 --- */
  #sheet {
    position: fixed; inset: 0; z-index: 10;
    background: rgba(0,0,0,.55);
    display: none;
    align-items: flex-end;
  }

  #sheet[data-open="1"] { display: flex; }

  .sheet-body {
    width: 100%; max-height: 72%;
    overflow-y: auto;
    background: #1B1626;
    border-radius: 24px 24px 0 0;
    padding: 14px 18px calc(24px + env(safe-area-inset-bottom));
    text-align: left;
  }

  .grip {
    width: 42px; height: 4px; margin: 0 auto 14px;
    border-radius: 2px; background: rgba(255,255,255,.18);
  }

  .sheet-body h2 { margin: 0 0 2px; font-size: 18px; font-weight: 800; }
  .sheet-body .fine { margin: 0 0 16px; }

  .group {
    margin: 0 0 9px; font-size: 11px; font-weight: 700;
    letter-spacing: .06em; color: rgba(242,238,248,.38);
  }

  .items {
    display: flex; flex-wrap: wrap; gap: 9px; margin-bottom: 18px;
  }

  .item {
    width: 62px; height: 62px; padding: 4px;
    display: grid; place-items: center;
    border-radius: 13px; border: 1px solid rgba(255,255,255,.1);
    background: rgba(255,255,255,.05);
    font-size: 30px; line-height: 1;
    color: #F2EEF8; font-family: inherit;
  }

  .item.text { font-size: 12px; font-weight: 800; text-align: center; }

  /* --- 안내 --- */
  .lede { margin: 0; font-size: 15.5px; color: rgba(242, 238, 248, .72); }
  .fine { margin: 0; font-size: 12.5px; color: rgba(242, 238, 248, .45); }
  .fine b { color: rgba(242, 238, 248, .75); font-weight: 700; }

  .notice {
    margin: 0; padding: 9px 14px;
    border-radius: 11px;
    background: rgba(255, 255, 255, .05);
    border: 1px solid rgba(255, 255, 255, .09);
    font-size: 11.5px; line-height: 1.6;
    color: rgba(242, 238, 248, .45);
  }

  .notice b { color: rgba(242, 238, 248, .75); font-weight: 700; }

  .center {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px;
  }

  #toast {
    position: fixed; left: 50%; bottom: 92px; transform: translateX(-50%);
    z-index: 20; padding: 11px 20px; border-radius: 12px;
    background: rgba(20,16,28,.95); border: 1px solid rgba(255,255,255,.12);
    font-size: 13.5px; font-weight: 700;
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }

  #toast[data-show="1"] { opacity: 1; }

  @media (prefers-reduced-motion: reduce) { .btn:active { transform: none; } }
</style>
</head>
<body>

<div class="brand">
  <span class="mark">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3 7.6 5H4a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3.6L15 3H9Zm3 5.5a5 5 0 1 1 0 10 5 5 0 0 1 0-10Zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6Z"/></svg>
  </span>
  GoodDevice photo zone
</div>

<main id="app"></main>
<div id="sheet"><div class="sheet-body" id="sheetBody"></div></div>
<div id="toast"></div>

<script>
"use strict";

// 사진이 있는 곳. 공개 버킷이라 키가 필요 없다 — 이 페이지에는 비밀이 없다.
var STORAGE = "https://tbfzjglkhttlyhhjebwu.supabase.co/storage/v1/object/public";
var BUCKET = "photo";

// ---------------------------------------------------------------------------
// 필터 — 앱(lib/models/photo_filter.dart)과 **같은 4x5 색 행렬**을 쓴다.
// 값이 갈라지면 태블릿 미리보기와 손님이 받는 사진의 색이 달라진다.
var FILTERS = [
  { id: "none",   label: "원본",     m: null },
  { id: "bright", label: "화사하게", m: [ 1.19685,-0.17880,-0.01805,0, 10,  -0.05315, 1.07120,-0.01805,0, 10,  -0.05315,-0.17880, 1.23195,0, 10] },
  { id: "soft",   label: "뽀샤시",   m: [ 0.95,    0,      0,      0, 24,   0,        0.95,   0,      0, 22,   0,       0,       0.95,   0, 19] },
  { id: "vivid",  label: "선명하게", m: [ 1.33110,-0.16450,-0.01660,0,-19.2, -0.04890, 1.21550,-0.01660,0,-19.2, -0.04890,-0.16450, 1.36340,0,-19.2] },
  { id: "film",   label: "필름",     m: [ 0.90,    0.05,   0.00,   0, 18,   0.02,     0.90,   0.02,   0, 14,   0.00,    0.03,    0.85,   0, 20] },
  { id: "warm",   label: "웜톤",     m: [ 1.08,    0,      0,      0,  6,   0,        1.02,   0,      0,  0,   0,       0,       0.92,   0,  0] },
  { id: "cool",   label: "쿨톤",     m: [ 0.95,    0,      0,      0,  0,   0,        1.00,   0,      0,  0,   0,       0,       1.10,   0,  6] },
  { id: "mono",   label: "흑백",     m: [ 0.2126,  0.7152, 0.0722, 0,  0,   0.2126,   0.7152, 0.0722, 0,  0,   0.2126,  0.7152,  0.0722, 0,  0] },
  { id: "sepia",  label: "세피아",   m: [ 0.393,   0.769,  0.189,  0,  0,   0.349,    0.686,  0.168,  0,  0,   0.272,   0.534,   0.131,  0,  0] }
];

// 스티커 — 앱(lib/models/sticker.dart)의 치과·치위생 묶음과 같다.
var STICKERS = [
  { label: "치아·구강", items: ["🦷","🪥","🫧","😁","😄","😬","😷"] },
  { label: "진료·위생", items: ["🩺","🏥","🧑‍⚕️","🩹","💊","🧼"] },
  { label: "칭찬·반짝", items: ["✨","💎","⭐","💯","👍","🥇","🎉","💙"] },
  { label: "문구", items: ["충치 ZERO","치아 건강","스케일링 완료","오늘도 칫솔질","환한 미소"], text: true }
];

// 문구는 글자 수가 많아 이모지와 같은 크기로 그리면 사진을 벗어난다 (앱과 같은 값).
function baseFraction(s) { return s.text ? 0.30 : 0.16; }

// ---------------------------------------------------------------------------
var app = document.getElementById("app");
var params = new URLSearchParams(location.search);
// 영숫자만 남겨 다른 경로를 가리키지 못하게 한다.
var id = (params.get("id") || "").replace(/[^a-zA-Z0-9]/g, "");

if (!id) {
  showMessage("사진 주소가 올바르지 않습니다.", "부스 화면의 QR을 다시 스캔해 주세요.");
} else {
  loadPhoto();
}

function showMessage(lede, fine) {
  app.innerHTML =
    '<div class="center">' +
      '<p class="lede">' + lede + '</p>' +
      '<p class="fine">' + fine + '</p>' +
    '</div>' + noticeHtml();
}

function noticeHtml() {
  return '<p class="notice">촬영한 사진은 <b>24시간 뒤 자동으로 삭제</b>됩니다. ' +
         '사진 외에 이름·연락처 등 개인정보는 수집하지 않습니다.</p>';
}

function loadPhoto() {
  app.innerHTML = '<div class="center"><p class="lede">사진을 불러오는 중…</p></div>';

  var image = new Image();
  // canvas로 꾸민 사진을 다시 저장하려면 CORS 허용 상태로 받아와야 한다.
  // 이게 없으면 canvas가 오염되어 toBlob이 막힌다.
  image.crossOrigin = "anonymous";

  image.onload = function () { startEditor(image); };
  image.onerror = function () {
    showMessage("사진을 찾을 수 없습니다.",
      "촬영 후 24시간이 지나 자동으로 삭제되었을 수 있어요.<br>부스 스태프에게 문의해 주세요.");
  };

  // 뒤에 붙은 t는 캐시를 피하려는 것이다. 부스에서 사진이 다시 올라가는 경우
  // CDN이 옛 사진을 몇 분간 그대로 내려준다.
  image.src = STORAGE + "/" + BUCKET + "/" + id + ".jpg?t=" + Date.now();
}

// ===========================================================================
// 편집기
// ===========================================================================
function startEditor(image) {
  var natW = image.naturalWidth, natH = image.naturalHeight;

  // 원본과, 필터를 입힌 사본. 필터는 바뀔 때만 다시 계산해 두고 그림은 이걸 쓴다
  // (매번 픽셀을 훑으면 손가락을 끄는 동안 화면이 끊긴다).
  var src = document.createElement("canvas");
  src.width = natW; src.height = natH;
  src.getContext("2d").drawImage(image, 0, 0);

  var filtered = document.createElement("canvas");
  filtered.width = natW; filtered.height = natH;

  var filterId = "none";
  var placed = [];      // {emoji|text, x, y, scale, rotation}
  var selected = -1;
  var nextId = 1;

  app.innerHTML =
    '<div id="stage"><canvas id="view"></canvas></div>' +
    '<div class="tools">' +
      '<p class="hint" id="hint">색감을 바꾸거나 스티커를 붙여보세요</p>' +
      '<div class="chips" id="chips"></div>' +
      '<div class="row">' +
        '<button class="btn ghost" id="stickerBtn" type="button">' +
          '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.5a4.5 4.5 0 0 0 7 0M9 9.5h.01M15 9.5h.01"/></svg>' +
          '스티커</button>' +
        '<button class="btn" id="saveBtn" type="button">' +
          '<svg viewBox="0 0 24 24"><path d="M12 3v11m0 0 4-4m-4 4-4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>' +
          '사진 저장하기</button>' +
      '</div>' +
      noticeHtml() +
    '</div>';

  var view = document.getElementById("view");
  var ctx = view.getContext("2d");
  var hint = document.getElementById("hint");

  buildChips();
  buildSheet();
  applyFilter();
  layout();
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);

  // -------------------------------------------------------------------------
  // 그리기 — 화면과 저장이 **같은 함수**를 쓴다. 규칙이 두 벌이면 손님이 맞춰둔
  // 자리와 저장된 사진이 어긋난다 (앱에서 실제로 겪은 문제다).
  function paint(c, W, H, showUi) {
    c.clearRect(0, 0, W, H);
    c.drawImage(filtered, 0, 0, W, H);

    for (var i = 0; i < placed.length; i++) {
      var s = placed[i];
      var size = W * baseFraction(s) * s.scale;
      c.save();
      c.translate(s.x * W, s.y * H);
      c.rotate(s.rotation);
      drawSticker(c, s, size);
      if (showUi && s.id === selected) drawHandles(c, s, size, W);
      c.restore();
    }
  }

  function drawSticker(c, s, size) {
    c.textAlign = "center";
    c.textBaseline = "middle";
    if (s.text) {
      // 굵게 쓰고 흰 테두리를 둘러 어떤 배경에서도 읽히게 한다 (앱과 같은 규칙).
      var fs = size * 0.26;
      c.font = "900 " + fs + "px " + fontStack();
      c.lineJoin = "round";
      c.lineWidth = fs * 0.42;
      c.strokeStyle = "#FFFFFF";
      c.strokeText(s.text, 0, 0);
      c.fillStyle = "#2B2340";
      c.fillText(s.text, 0, 0);
    } else {
      c.font = size + "px " + fontStack();
      c.fillText(s.emoji, 0, 0);
    }
  }

  function fontStack() {
    return '"Apple Color Emoji","Noto Color Emoji","Segoe UI Emoji",' +
           '"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif';
  }

  // 고른 스티커에만 보이는 조작 표시. 저장할 때는 그리지 않는다.
  function drawHandles(c, s, size, W) {
    var b = bounds(c, s, size);
    var pad = W * 0.012;
    var hw = b.w / 2 + pad, hh = b.h / 2 + pad;
    var r = W * 0.028;

    c.lineWidth = W * 0.004;
    c.strokeStyle = "rgba(255,255,255,.9)";
    c.setLineDash([W * 0.016, W * 0.012]);
    c.strokeRect(-hw, -hh, hw * 2, hh * 2);
    c.setLineDash([]);

    // 왼쪽 위: 지우기
    dot(c, -hw, -hh, r, "#EC4899");
    c.strokeStyle = "#fff"; c.lineWidth = r * 0.24;
    c.beginPath();
    c.moveTo(-hw - r * .38, -hh - r * .38); c.lineTo(-hw + r * .38, -hh + r * .38);
    c.moveTo(-hw + r * .38, -hh - r * .38); c.lineTo(-hw - r * .38, -hh + r * .38);
    c.stroke();

    // 오른쪽 아래: 크기·각도 손잡이
    dot(c, hw, hh, r, "#7C3AED");
    c.strokeStyle = "#fff"; c.lineWidth = r * 0.24;
    c.beginPath();
    c.moveTo(hw - r * .38, hh + r * .38); c.lineTo(hw + r * .38, hh - r * .38);
    c.moveTo(hw + r * .38, hh - r * .38); c.lineTo(hw + r * .1, hh - r * .38);
    c.moveTo(hw + r * .38, hh - r * .38); c.lineTo(hw + r * .38, hh - r * .1);
    c.stroke();
  }

  function dot(c, x, y, r, color) {
    c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2);
    c.fillStyle = color; c.fill();
    c.lineWidth = r * 0.16; c.strokeStyle = "rgba(0,0,0,.25)"; c.stroke();
  }

  // 스티커가 차지하는 상자. 손가락이 닿았는지 판단하는 데도 쓴다.
  function bounds(c, s, size) {
    if (!s.text) return { w: size, h: size };
    var fs = size * 0.26;
    c.font = "900 " + fs + "px " + fontStack();
    return { w: c.measureText(s.text).width + fs * 0.5, h: fs * 1.35 };
  }

  // -------------------------------------------------------------------------
  function layout() {
    var stage = document.getElementById("stage");
    if (!stage) return;
    var box = stage.getBoundingClientRect();
    var ar = natW / natH;
    var w = box.width, h = w / ar;
    if (h > box.height) { h = box.height; w = h * ar; }

    view.style.width = w + "px";
    view.style.height = h + "px";
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    view.width = Math.max(1, Math.round(w * dpr));
    view.height = Math.max(1, Math.round(h * dpr));
    render();
  }

  function render() { paint(ctx, view.width, view.height, true); }

  // -------------------------------------------------------------------------
  function applyFilter() {
    var f = null;
    for (var i = 0; i < FILTERS.length; i++) if (FILTERS[i].id === filterId) f = FILTERS[i];

    var fc = filtered.getContext("2d");
    fc.clearRect(0, 0, natW, natH);
    fc.drawImage(src, 0, 0);
    if (!f || !f.m) return;   // 원본이면 계산을 통째로 건너뛴다

    var data = fc.getImageData(0, 0, natW, natH);
    var d = data.data, m = f.m;
    for (var p = 0; p < d.length; p += 4) {
      var r = d[p], g = d[p + 1], b = d[p + 2];
      // Uint8ClampedArray가 0~255 밖 값을 알아서 잘라준다.
      d[p]     = m[0]  * r + m[1]  * g + m[2]  * b + m[4];
      d[p + 1] = m[5]  * r + m[6]  * g + m[7]  * b + m[9];
      d[p + 2] = m[10] * r + m[11] * g + m[12] * b + m[14];
    }
    fc.putImageData(data, 0, 0);
  }

  function buildChips() {
    var wrap = document.getElementById("chips");
    FILTERS.forEach(function (f) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "chip";
      b.textContent = f.label;
      b.setAttribute("aria-pressed", f.id === filterId ? "true" : "false");
      b.addEventListener("click", function () {
        filterId = f.id;
        [].forEach.call(wrap.children, function (c) { c.setAttribute("aria-pressed", "false"); });
        b.setAttribute("aria-pressed", "true");
        applyFilter();
        render();
      });
      wrap.appendChild(b);
    });
  }

  // -------------------------------------------------------------------------
  // 스티커 고르는 창
  function buildSheet() {
    var sheet = document.getElementById("sheet");
    var body = document.getElementById("sheetBody");

    var html = '<div class="grip"></div><h2>스티커 붙이기</h2>' +
      '<p class="fine">누르면 사진 가운데에 붙어요. 끌어서 옮기고, ' +
      '오른쪽 아래 손잡이를 끌면 크기와 각도가 바뀝니다.</p>';

    STICKERS.forEach(function (g, gi) {
      html += '<p class="group">' + g.label + '</p><div class="items">';
      g.items.forEach(function (v, ii) {
        html += '<button type="button" class="item' + (g.text ? " text" : "") +
                '" data-g="' + gi + '" data-i="' + ii + '">' + v + '</button>';
      });
      html += '</div>';
    });
    body.innerHTML = html;

    body.addEventListener("click", function (e) {
      var el = e.target.closest(".item");
      if (!el) return;
      var g = STICKERS[+el.getAttribute("data-g")];
      var v = g.items[+el.getAttribute("data-i")];
      addSticker(g.text ? { text: v } : { emoji: v });
      closeSheet();
    });

    // 창 바깥을 누르면 닫는다.
    sheet.addEventListener("click", function (e) { if (e.target === sheet) closeSheet(); });
    document.getElementById("stickerBtn").addEventListener("click", function () {
      sheet.setAttribute("data-open", "1");
    });
  }

  function closeSheet() { document.getElementById("sheet").removeAttribute("data-open"); }

  function addSticker(base) {
    base.id = nextId++;
    base.x = 0.5; base.y = 0.5; base.scale = 1; base.rotation = 0;
    placed.push(base);
    selected = base.id;
    hint.textContent = "끌어서 옮기고, 오른쪽 아래 손잡이로 크기와 각도를 맞추세요";
    render();
  }

  // -------------------------------------------------------------------------
  // 손가락 조작
  var mode = null;      // "move" | "handle"
  var startPt = null, startSticker = null, startDist = 0, startAngle = 0;

  view.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    var p = toCanvas(e);
    var W = view.width, H = view.height;

    // 고른 스티커의 손잡이부터 본다 — 스티커 위에 겹쳐 있기 때문이다.
    var sel = find(selected);
    if (sel) {
      var size = W * baseFraction(sel) * sel.scale;
      var b = bounds(ctx, sel, size);
      var pad = W * 0.012, r = W * 0.028;
      var local = toLocal(p, sel, W, H);

      if (dist(local, { x: b.w / 2 + pad, y: b.h / 2 + pad }) <= r * 1.7) {
        mode = "handle";
        startSticker = { scale: sel.scale, rotation: sel.rotation };
        var v = { x: p.x - sel.x * W, y: p.y - sel.y * H };
        startDist = Math.max(1, Math.hypot(v.x, v.y));
        startAngle = Math.atan2(v.y, v.x);
        view.setPointerCapture(e.pointerId);
        return;
      }
      if (dist(local, { x: -(b.w / 2 + pad), y: -(b.h / 2 + pad) }) <= r * 1.7) {
        placed = placed.filter(function (s) { return s.id !== selected; });
        selected = -1;
        render();
        return;
      }
    }

    // 위에 있는 것부터 집는다.
    for (var i = placed.length - 1; i >= 0; i--) {
      var s = placed[i];
      var sz = W * baseFraction(s) * s.scale;
      var bb = bounds(ctx, s, sz);
      var lp = toLocal(p, s, W, H);
      if (Math.abs(lp.x) <= bb.w / 2 && Math.abs(lp.y) <= bb.h / 2) {
        selected = s.id;
        mode = "move";
        startPt = p;
        startSticker = { x: s.x, y: s.y };
        view.setPointerCapture(e.pointerId);
        render();
        return;
      }
    }

    selected = -1;
    render();
  });

  view.addEventListener("pointermove", function (e) {
    if (!mode) return;
    e.preventDefault();
    var s = find(selected);
    if (!s) return;
    var p = toCanvas(e), W = view.width, H = view.height;

    if (mode === "move") {
      s.x = clamp(startSticker.x + (p.x - startPt.x) / W, 0, 1);
      s.y = clamp(startSticker.y + (p.y - startPt.y) / H, 0, 1);
    } else {
      var v = { x: p.x - s.x * W, y: p.y - s.y * H };
      var d = Math.max(1, Math.hypot(v.x, v.y));
      s.scale = clamp(startSticker.scale * (d / startDist), 0.3, 4);
      s.rotation = startSticker.rotation + (Math.atan2(v.y, v.x) - startAngle);
    }
    render();
  });

  ["pointerup", "pointercancel"].forEach(function (ev) {
    view.addEventListener(ev, function () { mode = null; });
  });

  function find(sid) {
    for (var i = 0; i < placed.length; i++) if (placed[i].id === sid) return placed[i];
    return null;
  }

  function toCanvas(e) {
    var r = view.getBoundingClientRect();
    return {
      x: (e.clientX - r.left) * (view.width / r.width),
      y: (e.clientY - r.top) * (view.height / r.height)
    };
  }

  // 스티커가 회전해 있어도 맞게 판단하도록, 스티커 기준 좌표로 바꾼다.
  function toLocal(p, s, W, H) {
    var dx = p.x - s.x * W, dy = p.y - s.y * H;
    var c = Math.cos(-s.rotation), sn = Math.sin(-s.rotation);
    return { x: dx * c - dy * sn, y: dx * sn + dy * c };
  }

  function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
  function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }

  // -------------------------------------------------------------------------
  // 저장 — 화면이 아니라 **원본 크기**로 다시 그려 내보낸다.
  document.getElementById("saveBtn").addEventListener("click", function () {
    var btn = this;
    btn.disabled = true;

    var out = document.createElement("canvas");
    out.width = natW; out.height = natH;
    paint(out.getContext("2d"), natW, natH, false);

    out.toBlob(function (blob) {
      btn.disabled = false;
      if (!blob) { toast("저장하지 못했어요. 사진을 길게 눌러 저장해 주세요."); return; }
      saveBlob(blob);
    }, "image/jpeg", 0.92);
  });

  function saveBlob(blob) {
    var name = "GoodDevice-photo-" + id + ".jpg";
    var file = null;
    try { file = new File([blob], name, { type: "image/jpeg" }); } catch (err) { file = null; }

    // 폰에서는 공유 시트로 넘기는 쪽이 사진첩에 바로 저장돼 손님이 헤매지 않는다.
    if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file] })
        .then(function () { toast("저장했어요!"); })
        .catch(function () { downloadBlob(blob, name); });
      return;
    }
    downloadBlob(blob, name);
  }

  function downloadBlob(blob, name) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
    toast("저장했어요! 안 보이면 사진첩·다운로드를 확인해 주세요.");
  }
}

var toastTimer = null;
function toast(text) {
  var el = document.getElementById("toast");
  el.textContent = text;
  el.setAttribute("data-show", "1");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { el.removeAttribute("data-show"); }, 3200);
}
</script>

</body>
</html>
